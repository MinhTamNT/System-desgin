<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      /* Custom Styles */
      .modal-enter {
        opacity: 0;
      }
      .modal-enter-active {
        opacity: 1;
        transition: opacity 300ms;
      }
      .modal-exit {
        opacity: 1;
      }
      .modal-exit-active {
        opacity: 0;
        transition: opacity 300ms;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex">
    <!-- Sidebar -->
    <aside
    class="sidebar w-72 bg-gray-900 text-gray-200 p-6 flex flex-col h-screen fixed shadow-xl z-10 overflow-y-auto"
  >
    <div class="flex items-center justify-center mb-8">
      <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary-400 to-primary-600">
        Admin Panel
      </h2>
    </div>
    <nav class="flex-grow">
      <ul>
        <li class="mb-3">
          <a
            href="./index.html"
            class="active-nav-item flex items-center py-3 px-4 rounded-lg transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Dashboard
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./user.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            User Management
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./project.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            Projects
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./inviation.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            Invitations
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./notification.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            Notifications
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./login.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </a>
        </li>
      </ul>
    </nav>
    <div class="mt-auto pt-6 border-t border-gray-700">
      <p class="text-sm text-gray-400 text-center">
        &copy; 2024 Pixel App
      </p>
    </div>
  </aside>

    <!-- Main Content -->
    <div class="flex-1 ml-64 p-8">
      <header
        class="flex items-center justify-between py-5 bg-white shadow-md rounded-lg px-6 mb-8"
      >
        <h1 class="text-3xl font-semibold text-gray-800">Projects List</h1>
      </header>

      <main>
        <div class="bg-white p-8 rounded-lg shadow-md space-y-6">
          <h2 class="text-2xl font-semibold mb-4 text-gray-700">
            Project List
          </h2>
          <div id="projects-list" class="space-y-4">
            <!-- Projects will be loaded here -->
          </div>
        </div>
      </main>
    </div>

    <!-- Project Detail Modal -->
    <div
      id="projectDetailModal"
      class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center hidden"
    >
      <div class="bg-white rounded-lg shadow-lg max-w-lg w-full">
        <div
          class="bg-gray-800 text-white p-4 rounded-t-lg flex justify-between items-center"
        >
          <h5 id="projectDetailModalLabel" class="text-lg font-semibold">
            Project Details
          </h5>
          <button
            class="text-white hover:text-gray-300"
            onclick="toggleModal()"
          >
            &times;
          </button>
        </div>
        <div class="p-4">
          <div id="project-detail" class="mb-4"></div>
          <canvas id="projectChart" class="mt-4 w-full h-64"></canvas>
        </div>
        <div class="bg-gray-100 p-4 rounded-b-lg flex justify-end">
          <button
            class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400"
            onclick="toggleModal()"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div
      id="confirmDeleteModal"
      class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center hidden"
    >
      <div class="bg-white rounded-lg shadow-lg max-w-sm w-full">
        <div
          class="bg-gray-800 text-white p-4 rounded-t-lg flex justify-between items-center"
        >
          <h5 id="confirmDeleteModalLabel" class="text-lg font-semibold">
            Confirm Delete
          </h5>
          <button
            class="text-white hover:text-gray-300"
            onclick="toggleConfirmDeleteModal()"
          >
            &times;
          </button>
        </div>
        <div class="p-4">
          <p class="text-gray-700">
            Are you sure you want to delete this project?
          </p>
        </div>
        <div class="bg-gray-100 p-4 rounded-b-lg flex justify-end">
          <button
            class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400 mr-2"
            onclick="toggleConfirmDeleteModal()"
          >
            Cancel
          </button>
          <button
            id="confirmDeleteButton"
            class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600"
            onclick="handleDelete()"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script>
      let deleteProjectId = null;
    
      function toggleModal() {
        const modal = document.getElementById("projectDetailModal");
        modal.classList.toggle("hidden");
        
        // Thêm hiệu ứng mượt mà khi hiện modal
        if (!modal.classList.contains("hidden")) {
          setTimeout(() => {
            modal.querySelector('.modal-content').classList.add('modal-enter-active');
          }, 10);
        } else {
          modal.querySelector('.modal-content').classList.remove('modal-enter-active');
        }
      }
    
      function toggleConfirmDeleteModal() {
        const modal = document.getElementById("confirmDeleteModal");
        modal.classList.toggle("hidden");
      }
    
      function showConfirmDeleteModal(projectId, projectName) {
        deleteProjectId = projectId;
        
        // Cập nhật thông báo xác nhận
        const confirmMessage = document.getElementById("confirmDeleteMessage");
        if (confirmMessage) {
          confirmMessage.textContent = `Are you sure you want to delete the project "${projectName}"?`;
        }
        
        toggleConfirmDeleteModal();
      }
    
      async function handleDelete() {
        if (!deleteProjectId) return;
        
        // Hiển thị loading
        const loader = document.getElementById("loader");
        if (loader) loader.classList.remove("hidden");
        
        try {
          await axios.delete(`/v1/api/projects/${deleteProjectId}`);
          
          // Hiển thị thông báo thành công
          showToast("Project deleted successfully", "success");
          
          // Đóng modal xác nhận
          toggleConfirmDeleteModal();
          
          // Tải lại danh sách
          loadProjects();
        } catch (error) {
          console.error("Error deleting project:", error);
          showToast("Error deleting project", "error");
        } finally {
          if (loader) loader.classList.add("hidden");
        }
      }
    
      document.addEventListener("DOMContentLoaded", () => {
        // Khởi tạo các thành phần UI
        initUI();
        
        async function loadProjects() {
          const loader = document.getElementById("loader");
          if (loader) loader.classList.remove("hidden");
          
          try {
            const response = await axios.get("/v1/api/projects");
            const projects = response.data;
    
            const projectsList = document.getElementById("projects-list");
            projectsList.innerHTML = "";
    
            if (projects.length === 0) {
              projectsList.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 bg-white rounded-xl shadow-md">
                  <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                  </svg>
                  <p class="text-gray-600 text-lg">No projects found</p>
                </div>
              `;
              return;
            }
    
            // Hiển thị danh sách dự án dạng grid
            const projectGrid = document.createElement("div");
            projectGrid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
    
            projects.forEach((project) => {
              // Xử lý ngày tháng nếu có
              let formattedDate = '';
              if (project.createdAt) {
                const date = new Date(project.createdAt);
                formattedDate = date.toLocaleDateString('en-US', { 
                  day: 'numeric', 
                  month: 'short',
                  year: 'numeric'
                });
              }
              
              // Tạo thẻ project card
              const projectCard = document.createElement("div");
              projectCard.className = "card-hover bg-white p-6 rounded-xl shadow-md border border-gray-200 transition duration-300";
              projectCard.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                  <div class="rounded-full bg-green-100 p-3">
                    <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                  </div>
                  <span class="text-sm text-gray-500">${formattedDate || 'No date'}</span>
                </div>
                
                <h2 class="text-xl font-semibold text-gray-800 mb-2 truncate" title="${project.name}">${project.name}</h2>
                <p class="text-gray-500 text-sm mb-4">ID: ${project.idProject}</p>
                
                <div class="flex space-x-2 mt-4">
                  <button type="button" class="view-details flex-1 bg-primary-50 text-primary-600 px-3 py-2 rounded-lg text-sm font-medium hover:bg-primary-100 transition duration-300 flex items-center justify-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    Details
                  </button>
                  <button type="button" class="delete-project flex-1 bg-red-50 text-red-600 px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-100 transition duration-300 flex items-center justify-center">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    Delete
                  </button>
                </div>
              `;
    
              // Thêm các event listeners
              projectCard.querySelector('.view-details').addEventListener('click', () => {
                loadProjectDetail(project.idProject);
              });
              
              projectCard.querySelector('.delete-project').addEventListener('click', () => {
                showConfirmDeleteModal(project.idProject, project.name);
              });
    
              projectGrid.appendChild(projectCard);
            });
    
            projectsList.appendChild(projectGrid);
          } catch (error) {
            console.error("Error loading projects:", error);
            const projectsList = document.getElementById("projects-list");
            projectsList.innerHTML = `
              <div class="bg-red-50 text-red-500 p-4 rounded-xl shadow-md">
                <p class="font-medium">Error loading projects</p>
                <p class="text-sm">${error.message || "Unknown error"}</p>
              </div>
            `;
          } finally {
            if (loader) loader.classList.add("hidden");
          }
        }
    
        async function loadProjectDetail(projectId) {
          const loader = document.getElementById("loader");
          if (loader) loader.classList.remove("hidden");
          
          try {
            const response = await axios.get(`/v1/api/projects/${projectId}`);
            const project = response.data;
    
            // Format date nếu có
            let formattedDate = 'Date not available';
            if (project.createdAt) {
              const date = new Date(project.createdAt);
              formattedDate = date.toLocaleDateString('en-US', { 
                weekday: 'long',
                day: 'numeric', 
                month: 'long',
                year: 'numeric'
              });
            }
    
            const projectDetail = document.getElementById("project-detail");
            projectDetail.innerHTML = `
              <div class="bg-gradient-to-r from-green-500 to-green-600 text-white rounded-t-lg p-4">
                <h3 class="text-xl font-bold">${project.name}</h3>
                <p class="text-white text-opacity-80">ID: ${project.idProject}</p>
              </div>
              
              <div class="p-5 space-y-4">
                <div class="bg-white p-4 rounded-lg shadow-sm">
                  <p class="text-gray-500 text-sm">Description</p>
                  <p class="text-gray-800">${project.description || 'No description available'}</p>
                </div>
                
                <div class="bg-white p-4 rounded-lg shadow-sm">
                  <p class="text-gray-500 text-sm">Created At</p>
                  <p class="text-gray-800 font-medium">${formattedDate}</p>
                </div>
              </div>
            `;
    
            // Fetch chart data
            const chartResponse = await axios.get(`/v1/api/storage-size/${projectId}`);
            const chartData = chartResponse.data;
    
            // Update Chart.js
            const ctx = document.getElementById("projectChart").getContext("2d");
            new Chart(ctx, {
              type: "line",
              data: {
                labels: chartData.labels || ["KB", "MB", "GB", "TB"],
                datasets: [
                  {
                    label: "Project Storage",
                    data: chartData.totalSize || [0, 0, 0, 0],
                    borderColor: "rgba(99, 102, 241, 1)",
                    backgroundColor: "rgba(99, 102, 241, 0.2)",
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true,
                  },
                ],
              },
              options: {
                responsive: true,
                plugins: {
                  legend: {
                    position: "top",
                    labels: {
                      usePointStyle: true,
                      font: {
                        family: 'Poppins',
                      }
                    }
                  },
                  tooltip: {
                    backgroundColor: 'rgba(50, 50, 93, 0.9)',
                    titleColor: 'white',
                    bodyColor: 'white',
                    bodyFont: {
                      family: 'Poppins'
                    },
                    titleFont: {
                      family: 'Poppins',
                      weight: 'bold'
                    },
                    padding: 12,
                    displayColors: true,
                    usePointStyle: true,
                    callbacks: {
                      label: function (context) {
                        return `${context.dataset.label}: ${context.parsed.y}`;
                      },
                    },
                  },
                },
                scales: {
                  x: { 
                    grid: {
                      display: false
                    }
                  },
                  y: { 
                    beginAtZero: true,
                    grid: {
                      color: 'rgba(200, 200, 200, 0.2)',
                    }
                  },
                },
              },
            });
    
            toggleModal();
          } catch (error) {
            console.error("Error loading project details:", error);
            showToast("Error loading project details", "error");
          } finally {
            if (loader) loader.classList.add("hidden");
          }
        }
        
        // Hàm hiển thị toast message
        function showToast(message, type = "info") {
          // Tạo toast nếu chưa có
          let toastContainer = document.getElementById("toast-container");
          if (!toastContainer) {
            toastContainer = document.createElement("div");
            toastContainer.id = "toast-container";
            toastContainer.className = "fixed bottom-4 right-4 z-50";
            document.body.appendChild(toastContainer);
          }
          
          // Màu sắc dựa trên loại
          let bgColor, textColor, icon;
          switch (type) {
            case "success":
              bgColor = "bg-green-500";
              textColor = "text-white";
              icon = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                      </svg>`;
              break;
            case "error":
              bgColor = "bg-red-500";
              textColor = "text-white";
              icon = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                      </svg>`;
              break;
            default:
              bgColor = "bg-blue-500";
              textColor = "text-white";
              icon = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                      </svg>`;
          }
          
          // Tạo toast
          const toast = document.createElement("div");
          toast.className = `${bgColor} ${textColor} flex items-center p-4 rounded-lg shadow-lg transform translate-y-0 opacity-100 transition-all duration-300 ease-out mb-2`;
          toast.innerHTML = `
            ${icon}
            <span>${message}</span>
          `;
          
          // Thêm vào container
          toastContainer.appendChild(toast);
          
          // Ẩn sau 3 giây
          setTimeout(() => {
            toast.classList.add("opacity-0", "translate-y-2");
            setTimeout(() => {
              toast.parentNode && toast.parentNode.removeChild(toast);
            }, 300);
          }, 3000);
        }
        
        // Khởi tạo UI components nếu chưa có
        function initUI() {
          // Thêm loader nếu chưa có
          if (!document.getElementById("loader")) {
            const loader = document.createElement("div");
            loader.id = "loader";
            loader.className = "fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 hidden";
            loader.innerHTML = `
              <div class="bg-white p-5 rounded-lg shadow-lg flex items-center space-x-3">
                <svg class="animate-spin h-5 w-5 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Loading...</span>
              </div>
            `;
            document.body.appendChild(loader);
          }
          
          // Cập nhật modal xác nhận xóa
          const confirmModal = document.getElementById("confirmDeleteModal");
          if (confirmModal) {
            // Thêm thông báo nếu chưa có
            if (!document.getElementById("confirmDeleteMessage")) {
              const messageDiv = document.createElement("p");
              messageDiv.id = "confirmDeleteMessage";
              messageDiv.className = "text-gray-700 mb-4";
              messageDiv.textContent = "Are you sure you want to delete this project?";
              
              const modalBody = confirmModal.querySelector("div.p-4") || confirmModal.querySelector(".modal-body");
              if (modalBody && !document.getElementById("confirmDeleteMessage")) {
                modalBody.insertBefore(messageDiv, modalBody.firstChild);
              }
            }
          }
          
          // Cập nhật project detail modal
          const detailModal = document.getElementById("projectDetailModal");
          if (detailModal) {
            // Thêm class modal-content nếu chưa có
            const modalContent = detailModal.querySelector(".bg-white");
            if (modalContent && !modalContent.classList.contains("modal-content")) {
              modalContent.classList.add("modal-content", "transition-transform", "duration-300", "transform");
            }
          }
        }
        
        // Định nghĩa hàm toggleConfirmDeleteModal trong window scope
        window.toggleConfirmDeleteModal = toggleConfirmDeleteModal;
        
        // Định nghĩa hàm handleDelete trong window scope
        window.handleDelete = handleDelete;
        
        // Định nghĩa hàm toggleModal trong window scope
        window.toggleModal = toggleModal;
        
        // Định nghĩa hàm showConfirmDeleteModal trong window scope
        window.showConfirmDeleteModal = showConfirmDeleteModal;
        
        // Tải dự án khi trang được tải
        loadProjects();
      });
    </script>
