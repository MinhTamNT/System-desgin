<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      /* Custom Styles */
      .modal-enter {
        opacity: 0;
      }
      .modal-enter-active {
        opacity: 1;
        transition: opacity 300ms;
      }
      .modal-exit {
        opacity: 1;
      }
      .modal-exit-active {
        opacity: 0;
        transition: opacity 300ms;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen flex">
    <!-- Sidebar -->
    <aside
    class="sidebar w-72 bg-gray-900 text-gray-200 p-6 flex flex-col h-screen fixed shadow-xl z-10 overflow-y-auto"
  >
    <div class="flex items-center justify-center mb-8">
      <h2 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-primary-400 to-primary-600">
        Admin Panel
      </h2>
    </div>
    <nav class="flex-grow">
      <ul>
        <li class="mb-3">
          <a
            href="./index.html"
            class="active-nav-item flex items-center py-3 px-4 rounded-lg transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            Dashboard
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./user.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
            User Management
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./project.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            Projects
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./inviation.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
            Invitations
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./notification.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            Notifications
          </a>
        </li>
        <li class="mb-3">
          <a
            href="./login.html"
            class="flex items-center py-3 px-4 rounded-lg hover:bg-gray-800 transition duration-300"
          >
            <svg class="h-5 w-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Logout
          </a>
        </li>
      </ul>
    </nav>
    <div class="mt-auto pt-6 border-t border-gray-700">
      <p class="text-sm text-gray-400 text-center">
        &copy; 2024 Pixel App
      </p>
    </div>
  </aside>

    <!-- Main Content -->
    <div class="flex-1 ml-64 p-8">
      <header
        class="flex items-center justify-between py-5 bg-white shadow-md rounded-lg px-6 mb-8"
      >
        <h1 class="text-3xl font-semibold text-gray-800">Notifications List</h1>
      </header>

      <main>
        <div class="bg-white p-8 rounded-lg shadow-md space-y-6">
          <h2 class="text-2xl font-semibold mb-4 text-gray-700">
            Notifications
          </h2>
          <div id="notifications-list" class="space-y-4">
            <!-- Notifications will be loaded here -->
          </div>
        </div>
      </main>
    </div>

    <!-- Notification Detail Modal -->
    <div
      id="notificationDetailModal"
      class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center hidden"
    >
      <div
        class="bg-white rounded-lg shadow-lg max-w-lg w-full transition-opacity duration-300"
      >
        <div
          class="bg-gray-800 text-white p-4 rounded-t-lg flex justify-between items-center"
        >
          <h5 id="notificationDetailModalLabel" class="text-lg font-semibold">
            Notification Details
          </h5>
          <button
            class="text-white hover:text-gray-300"
            onclick="toggleDetailModal()"
          >
            ×
          </button>
        </div>
        <div class="p-4">
          <div id="notification-detail" class="mb-4"></div>
        </div>
        <div class="bg-gray-100 p-4 rounded-b-lg flex justify-end">
          <button
            class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400"
            onclick="toggleDetailModal()"
          >
            Close
          </button>
        </div>
      </div>
    </div>

    <script>
      function toggleDetailModal() {
        const modal = document.getElementById("notificationDetailModal");
        modal.classList.toggle("hidden");
        
        // Thêm hiệu ứng mượt mà khi hiện modal
        if (!modal.classList.contains("hidden")) {
          setTimeout(() => {
            modal.querySelector('.modal-content').classList.add('modal-enter-active');
          }, 10);
        } else {
          modal.querySelector('.modal-content').classList.remove('modal-enter-active');
        }
      }
    
      document.addEventListener("DOMContentLoaded", () => {
        async function loadNotifications() {
          try {
            const response = await axios.get("/v1/notifications");
            const notifications = response.data;
    
            const notificationsList = document.getElementById("notifications-list");
            notificationsList.innerHTML = "";
    
            if (notifications.length === 0) {
              notificationsList.innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 bg-white rounded-xl shadow-md">
                  <svg class="w-16 h-16 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                  </svg>
                  <p class="text-gray-600 text-lg">No notifications found</p>
                </div>
              `;
              return;
            }
    
            notifications.forEach((notification) => {
              // Tạo icon dựa trên loại thông báo
              let iconClass = "blue";
              let iconPath = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>`;
              
              // Nếu message chứa từ khóa, thay đổi icon
              if (notification.message.toLowerCase().includes("project")) {
                iconClass = "green";
                iconPath = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>`;
              } else if (notification.message.toLowerCase().includes("user") || notification.message.toLowerCase().includes("permission")) {
                iconClass = "purple";
                iconPath = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>`;
              }
    
              const notificationDiv = document.createElement("div");
              notificationDiv.className = "card-hover bg-white p-6 rounded-xl shadow-md transition duration-300 border border-gray-200 flex items-start space-x-4 mb-4";
    
              // Format date nếu có
              let formattedDate = '';
              if (notification.createdAt) {
                const date = new Date(notification.createdAt);
                formattedDate = date.toLocaleDateString('en-US', { 
                  day: 'numeric', 
                  month: 'short',
                  year: 'numeric',
                  hour: '2-digit',
                  minute: '2-digit'
                });
              }
    
              notificationDiv.innerHTML = `
                <div class="rounded-full bg-${iconClass}-100 p-3 flex-shrink-0">
                  <svg class="h-6 w-6 text-${iconClass}-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    ${iconPath}
                  </svg>
                </div>
                <div class="flex-grow">
                  <h2 class="text-xl font-semibold text-gray-800 mb-1">${notification.message}</h2>
                  <p class="text-gray-500 text-sm mb-3">${formattedDate || 'Date not available'}</p>
                  <div class="flex space-x-3">
                    <button type="button" class="view-details bg-primary-50 text-primary-600 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-primary-100 transition duration-300 flex items-center">
                      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                      </svg>
                      View Details
                    </button>
                    <button type="button" class="delete-notification bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-red-100 transition duration-300 flex items-center">
                      <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                      </svg>
                      Delete
                    </button>
                  </div>
                </div>
              `;
    
              // Thêm event listeners
              notificationDiv.querySelector('.view-details').addEventListener('click', () => {
                loadNotificationDetail(notification.idNotification);
              });
              
              notificationDiv.querySelector('.delete-notification').addEventListener('click', () => {
                confirmDelete(notification.idNotification, notification.message);
              });
    
              notificationsList.appendChild(notificationDiv);
            });
          } catch (error) {
            console.error("Error loading notifications:", error);
            const notificationsList = document.getElementById("notifications-list");
            notificationsList.innerHTML = `
              <div class="bg-red-50 text-red-500 p-4 rounded-xl shadow-md">
                <p class="font-medium">Error loading notifications</p>
                <p class="text-sm">${error.message || "Unknown error"}</p>
              </div>
            `;
          }
        }
        
        function confirmDelete(notificationId, message) {
          const confirmModal = document.getElementById("confirmDeleteModal");
          const confirmDeleteButton = document.getElementById("confirmDeleteButton");
          const confirmMessage = document.getElementById("confirmDeleteMessage");
          
          // Cập nhật thông báo xác nhận
          confirmMessage.textContent = `Are you sure you want to delete this notification: "${message.substring(0, 50)}${message.length > 50 ? '...' : ''}"?`;
          
          // Hiển thị modal
          confirmModal.classList.remove("hidden");
          
          // Cài đặt sự kiện cho nút xác nhận
          const oldConfirmClick = confirmDeleteButton.onclick;
          confirmDeleteButton.onclick = async () => {
            await deleteNotification(notificationId);
            toggleConfirmDeleteModal();
          };
          
          // Lưu trữ để khôi phục sau khi đóng modal
          confirmModal.dataset.oldConfirmClick = oldConfirmClick;
        }
        
        function toggleConfirmDeleteModal() {
          const confirmModal = document.getElementById("confirmDeleteModal");
          confirmModal.classList.toggle("hidden");
          
          // Khôi phục onclick nếu đang đóng modal
          if (confirmModal.classList.contains("hidden")) {
            document.getElementById("confirmDeleteButton").onclick = null;
          }
        }
    
        async function deleteNotification(notificationId) {
          try {
            // Hiển thị loading indicator
            const loader = document.getElementById("loader");
            if (loader) loader.classList.remove("hidden");
            
            await axios.delete(`/v1/notifications/${notificationId}`);
            
            // Thông báo thành công
            showToast("Notification deleted successfully", "success");
            
            // Tải lại danh sách
            loadNotifications();
          } catch (error) {
            console.error("Error deleting notification:", error);
            showToast("Error deleting notification", "error");
          } finally {
            // Ẩn loading indicator
            const loader = document.getElementById("loader");
            if (loader) loader.classList.add("hidden");
          }
        }
    
        async function loadNotificationDetail(notificationId) {
          try {
            const loader = document.getElementById("loader");
            if (loader) loader.classList.remove("hidden");
            
            const response = await axios.get(`/v1/notifications/${notificationId}`);
            const notification = response.data;
    
            const notificationDetail = document.getElementById("notification-detail");
            
            // Format date
            let formattedDate = 'Date not available';
            if (notification.createdAt) {
              const date = new Date(notification.createdAt);
              formattedDate = date.toLocaleDateString('en-US', { 
                weekday: 'long',
                day: 'numeric', 
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
              });
            }
            
            // Make a nice card style with sections and background color
            notificationDetail.innerHTML = `
              <div class="bg-gradient-to-r from-primary-500 to-primary-600 text-black rounded-t-lg p-4">
                <h3 class="text-xl font-bold">${notification.message}</h3>
                <p class="text-white text-opacity-80">ID: ${notification.idNotification}</p>
              </div>
              
              <div class="p-5 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="bg-white p-4 rounded-lg shadow-sm">
                    <p class="text-gray-500 text-sm">Requested By</p>
                    <p class="text-gray-800 font-medium">${notification.userRequestUsername || 'Unknown'}</p>
                  </div>
                  
                  <div class="bg-white p-4 rounded-lg shadow-sm">
                    <p class="text-gray-500 text-sm">Tanker</p>
                    <p class="text-gray-800 font-medium">${notification.userTankerUsername || 'Unknown'}</p>
                  </div>
                </div>
                
                <div class="bg-white p-4 rounded-lg shadow-sm">
                  <p class="text-gray-500 text-sm">Created At</p>
                  <p class="text-gray-800 font-medium">${formattedDate}</p>
                </div>
                
                <div class="bg-white p-4 rounded-lg shadow-sm">
                  <p class="text-gray-500 text-sm">Message</p>
                  <p class="text-gray-800">${notification.message}</p>
                </div>
              </div>
            `;
    
            toggleDetailModal();
          } catch (error) {
            console.error("Error loading notification details:", error);
            showToast("Error loading notification details", "error");
          } finally {
            const loader = document.getElementById("loader");
            if (loader) loader.classList.add("hidden");
          }
        }
        
        function showToast(message, type = "info") {
          // Tạo toast nếu chưa có
          let toastContainer = document.getElementById("toast-container");
          if (!toastContainer) {
            toastContainer = document.createElement("div");
            toastContainer.id = "toast-container";
            toastContainer.className = "fixed bottom-4 right-4 z-50";
            document.body.appendChild(toastContainer);
          }
          
          // Màu sắc dựa trên loại
          let bgColor, textColor, icon;
          switch (type) {
            case "success":
              bgColor = "bg-green-500";
              textColor = "text-white";
              icon = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                      </svg>`;
              break;
            case "error":
              bgColor = "bg-red-500";
              textColor = "text-white";
              icon = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                      </svg>`;
              break;
            default:
              bgColor = "bg-blue-500";
              textColor = "text-white";
              icon = `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                      </svg>`;
          }
          
          // Tạo toast
          const toast = document.createElement("div");
          toast.className = `${bgColor} ${textColor} flex items-center p-4 rounded-lg shadow-lg transform translate-y-0 opacity-100 transition-all duration-300 ease-out mb-2`;
          toast.innerHTML = `
            ${icon}
            <span>${message}</span>
          `;
          
          // Thêm vào container
          toastContainer.appendChild(toast);
          
          // Ẩn sau 3 giây
          setTimeout(() => {
            toast.classList.add("opacity-0", "translate-y-2");
            setTimeout(() => {
              if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
              }
            }, 300);
          }, 3000);
        }
    
        // Thêm loader nếu chưa có
        if (!document.getElementById("loader")) {
          const loader = document.createElement("div");
          loader.id = "loader";
          loader.className = "fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 hidden";
          loader.innerHTML = `
            <div class="bg-white p-5 rounded-lg shadow-lg flex items-center space-x-3">
              <svg class="animate-spin h-5 w-5 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Loading...</span>
            </div>
          `;
          document.body.appendChild(loader);
        }
    
        // Nếu không có modal xác nhận xóa, thêm vào
        if (!document.getElementById("confirmDeleteModal")) {
          const confirmModal = document.createElement("div");
          confirmModal.id = "confirmDeleteModal";
          confirmModal.className = "fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center hidden z-50";
          confirmModal.innerHTML = `
            <div class="bg-white rounded-xl shadow-lg max-w-md w-full">
              <div class="bg-red-600 text-white p-4 rounded-t-xl flex justify-between items-center">
                <h5 class="text-lg font-semibold">Confirm Delete</h5>
                <button class="text-white hover:text-gray-200" onclick="toggleConfirmDeleteModal()">
                  &times;
                </button>
              </div>
              <div class="p-5">
                <p id="confirmDeleteMessage" class="text-gray-700 mb-4">
                  Are you sure you want to delete this notification?
                </p>
                <div class="flex justify-end space-x-3">
                  <button
                    class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition duration-200"
                    onclick="toggleConfirmDeleteModal()"
                  >
                    Cancel
                  </button>
                  <button
                    id="confirmDeleteButton"
                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition duration-200"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          `;
          document.body.appendChild(confirmModal);
        }
        
        // Define the toggleConfirmDeleteModal function globally
        window.toggleConfirmDeleteModal = toggleConfirmDeleteModal;
    
        loadNotifications();
      });
    </script>
  </body>
</html>
